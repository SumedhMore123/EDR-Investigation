title: Suspicious PowerShell Encoded Command Indicator
id: 9d4b5f49-2e3f-4f50-a954-a59b0b018001
status: experimental
description: Detects PowerShell process creation containing common encoded-command indicators. Requires tuning and validation.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: EDR Investigation Lab
date: 2026/11/02
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_command:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
  condition: selection_image and selection_command
falsepositives:
  - Authorized administration and deployment scripts
level: medium
