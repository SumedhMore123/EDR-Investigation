title: Script Interpreter Spawned by Office Application
id: 9d4b5f49-2e3f-4f50-a954-a59b0b018003
status: experimental
description: Flags script interpreters launched by common Office applications. Requires process-creation telemetry and environment-specific tuning.
references:
  - https://attack.mitre.org/techniques/T1059/
author: EDR Investigation Lab
date: 2026/11/02
tags:
  - attack.execution
  - attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
  condition: selection_child and selection_parent
falsepositives:
  - Approved macros, add-ins or automation
level: high
